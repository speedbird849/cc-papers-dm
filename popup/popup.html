<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperShade</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PaperShade</h1>
          <span class="subtitle">CodeChef VIT Papers</span>
        </div>
      </div>
      <div class="status-indicator">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText" class="status-text">Active</span>
      </div>
    </header>

    <!-- Main Toggle Card -->
    <div class="card toggle-card">
      <div class="toggle-info">
        <span class="card-title">Invert Paper Colors</span>
        <span class="card-desc">Clear black & radiant white</span>
      </div>
      <label class="switch" for="enabledToggle">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Mode Selector -->
    <div class="section">
      <label class="section-label">Reading Mode</label>
      <div class="mode-grid">
        <button class="mode-btn active" data-mode="mono-bw">
          <span class="mode-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z"/></svg>
          </span>
          <span class="mode-name">Clear B&W</span>
          <span class="mode-hint">No glow, bright white</span>
        </button>
        <button class="mode-btn" data-mode="color-diagrams">
          <span class="mode-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C21.438 6.5 16.5 2 12 2z"/></svg>
          </span>
          <span class="mode-name">Color Restore</span>
          <span class="mode-hint">Preserves diagrams</span>
        </button>
        <button class="mode-btn" data-mode="sepia-dark">
          <span class="mode-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
          </span>
          <span class="mode-name">Warm Dark</span>
          <span class="mode-hint">Sepia night reading</span>
        </button>
      </div>
    </div>

    <!-- Adjustments -->
    <div class="section">
      <div class="section-header-flex">
        <label class="section-label">Fine Adjustments</label>
        <button id="resetAdjustments" class="reset-link" title="Reset all adjustments to defaults">Reset</button>
      </div>
      <div class="card adjustment-card">
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Text Brightness</span>
            <span id="textBrightnessVal" class="val-badge">120%</span>
          </div>
          <input type="range" id="textBrightnessSlider" min="80" max="180" value="120" class="range-slider">
        </div>
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Black Depth (Shadow Clean)</span>
            <span id="blackDepthVal" class="val-badge">110%</span>
          </div>
          <input type="range" id="blackDepthSlider" min="60" max="160" value="110" class="range-slider">
        </div>
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Text Contrast</span>
            <span id="contrastVal" class="val-badge">110%</span>
          </div>
          <input type="range" id="contrastSlider" min="80" max="150" value="110" class="range-slider">
        </div>
      </div>
    </div>

    <!-- Quick Options -->
    <div class="section">
      <label class="checkbox-row" for="floatingBtnToggle">
        <input type="checkbox" id="floatingBtnToggle" checked>
        <span class="checkbox-custom"></span>
        <span class="checkbox-label">Show floating on-page quick toggle</span>
      </label>
    </div>

    <!-- Shortcut Hint -->
    <div class="shortcut-box">
      <span class="shortcut-text">Quick toggle with</span>
      <kbd class="kbd-key">Alt</kbd> + <kbd class="kbd-key">I</kbd>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v1.4.6</span>
      <a href="https://papers.codechefvit.com" target="_blank" class="footer-link">papers.codechefvit.com ↗</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
