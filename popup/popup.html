<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperShade</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PaperShade</h1>
          <span class="subtitle">CodeChef VIT Papers</span>
        </div>
      </div>
      <div class="status-indicator">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText" class="status-text">Active</span>
      </div>
    </header>

    <div class="card toggle-card">
      <div class="toggle-info">
        <span class="card-title">Invert Paper Colors</span>
        <span class="card-desc">Dark mode for exam papers</span>
      </div>
      <label class="switch" for="enabledToggle">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <label class="section-label">Reading Mode</label>
      <div class="mode-grid">
        <button class="mode-btn active" data-mode="smart-dark">
          <span class="mode-icon">🌙</span>
          <span class="mode-name">Smart Dark</span>
          <span class="mode-hint">Keeps diagram hues</span>
        </button>
        <button class="mode-btn" data-mode="pure-invert">
          <span class="mode-icon">⚡</span>
          <span class="mode-name">Pure Invert</span>
          <span class="mode-hint">Direct 1:1 negative</span>
        </button>
        <button class="mode-btn" data-mode="sepia-dark">
          <span class="mode-icon">☕</span>
          <span class="mode-name">Warm Dark</span>
          <span class="mode-hint">Sepia night reading</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-header-flex">
        <label class="section-label">Fine Adjustments</label>
        <button id="resetAdjustments" class="reset-link" title="Reset contrast & brightness">Reset</button>
      </div>
      <div class="card adjustment-card">
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Contrast</span>
            <span id="contrastVal" class="val-badge">95%</span>
          </div>
          <input type="range" id="contrastSlider" min="70" max="130" value="95" class="range-slider">
        </div>
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Brightness</span>
            <span id="brightnessVal" class="val-badge">100%</span>
          </div>
          <input type="range" id="brightnessSlider" min="70" max="130" value="100" class="range-slider">
        </div>
      </div>
    </div>

    <div class="section">
      <label class="checkbox-row" for="floatingBtnToggle">
        <input type="checkbox" id="floatingBtnToggle" checked>
        <span class="checkbox-custom"></span>
        <span class="checkbox-label">Show floating on-page quick toggle</span>
      </label>
    </div>

    <div class="shortcut-box">
      <span class="shortcut-text">Quick toggle with</span>
      <kbd class="kbd-key">Alt</kbd> + <kbd class="kbd-key">I</kbd>
    </div>

    <footer class="footer">
      <span class="version">v1.0.0</span>
      <a href="https://papers.codechefvit.com" target="_blank" class="footer-link">papers.codechefvit.com ↗</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
